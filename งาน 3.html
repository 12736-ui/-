        <title>การใช้คำสั่ง<pre></pre></title>
    </head>
    <body>
        <pre>
            "เร็วก็หาว่าล้ำหน้า
            พอช้าก็หาว่าอืดอาด
            โง่ก็ถุกตวด
            พอฉลาดก็ถูกระแวง
            ทำก่อนบอกไม่ได้สั่ง
            ครัั้นพอทำทีหลังบอกไม่รุ้จักคิด
            คนดี ดี ถูกถีบไปไกลแล้ว
            แต่กลับเอาคนชั่วมาใกล้ชิด"
        </pre>
    </body>
